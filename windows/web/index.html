<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <meta name="app-build" content="__BUILD__">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AM PC Remote</title>
  <link rel="manifest" href="/manifest.webmanifest?v=__BUILD__">
  <link rel="icon" href="/icon.svg?v=__BUILD__" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg?v=__BUILD__">
  <link rel="stylesheet" href="/app.css?v=__BUILD__">
</head>
<body>
  <div id="app">
    <section id="login" class="login hidden">
      <div class="login-card">
        <div class="logo"><svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><rect x="4" y="10" width="34" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 42h18" stroke="currentColor" stroke-width="3"/><rect x="40" y="26" width="20" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="50" cy="50" r="2.5" fill="currentColor"/></svg></div>
        <h1 id="login-name">AM PC Remote</h1>
        <p class="muted">Enter the PIN shown on your PC</p>
        <input id="pin" class="pin-input" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
        <button id="pair" class="btn primary big">Connect</button>
        <p id="login-error" class="error"></p>
        <p class="hint">Open <strong id="login-url">/admin</strong> on the PC to view or rotate the PIN.</p>
      </div>
    </section>

    <section id="main" class="hidden">
      <header class="topbar">
        <button id="back" class="icon-btn hidden" aria-label="Back">‹</button>
        <div class="title-wrap">
          <h1 id="title">AM PC Remote</h1>
          <div id="subtitle" class="subtitle">connecting…</div>
        </div>
        <div class="top-right">
          <div id="remote-tools" class="top-tools"></div>
          <span id="battery" class="battery hidden"></span>
          <button id="menu" class="icon-btn" aria-label="Menu">⋯</button>
        </div>
      </header>

      <main id="view" class="view"></main>

      <nav id="tabs" class="tabs">
        <button data-tab="home" class="tab active"><span>▦</span>Remotes</button>
        <button data-tab="am.trackpad" class="tab"><span>◉</span>Trackpad</button>
        <button data-tab="am.keyboard" class="tab"><span>⌨</span>Keyboard</button>
        <button data-tab="am.media" class="tab"><span>▶</span>Media</button>
      </nav>
    </section>

    <div id="toast" class="toast"></div>
    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="modal-title">Confirm</h2>
        <p id="modal-text"></p>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn ghost">Cancel</button>
          <button id="modal-ok" class="btn danger">Continue</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/app.js?v=__BUILD__" type="module"></script>
</body>
</html>
